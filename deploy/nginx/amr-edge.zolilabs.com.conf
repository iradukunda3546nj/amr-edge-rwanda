# /etc/nginx/sites-available/amr-edge.zolilabs.com
# Cloudflare (proxied, SSL mode "Full (strict)") -> Nginx with Cloudflare Origin CA cert.

server {
    listen 80;
    listen [::]:80;
    server_name amr-edge.zolilabs.com amr_edge.zolilabs.com;
    return 301 https://amr-edge.zolilabs.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;                       # Nginx >= 1.25.1; older: "listen 443 ssl http2;"
    server_name amr-edge.zolilabs.com amr_edge.zolilabs.com;

    ssl_certificate     /etc/ssl/cloudflare/zolilabs.com.pem;
    ssl_certificate_key /etc/ssl/cloudflare/zolilabs.com.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;

    root  /var/www/amr_edge/current;
    index index.html;

    access_log /var/log/nginx/amr_edge.access.log;
    error_log  /var/log/nginx/amr_edge.error.log warn;

    # Security headers. The page ships no inline scripts and no third-party JS,
    # so scripts are locked to 'self'; only Google Fonts is allowed off-origin.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Cache-Control "no-cache" always;   # single-page demo: always revalidate
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;

    gzip on;
    gzip_types text/html text/css application/javascript image/svg+xml text/markdown;

    location / {
        try_files $uri $uri/ =404;
    }

    location ~ /\. { deny all; }
}
